<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .dash-card {
      width: 100%;
      max-width: 480px;
    }
    .dash-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      margin-bottom: 1.75rem;
    }
    .dash-title {
      font-size: 1.4rem;
      font-weight: 700;
    }
    .dash-username {
      font-size: 0.85rem;
      color: var(--purple-bright);
      font-weight: 500;
    }
    .logout-btn {
      background: none;
      border: 1px solid rgba(255,255,255,0.12);
      color: var(--text-muted);
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.8rem;
      padding: 0.4rem 0.9rem;
      border-radius: var(--radius-btn);
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
    }
    .logout-btn:hover {
      border-color: rgba(255,255,255,0.3);
      color: var(--text);
    }
    .dash-form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      width: 100%;
    }
    .field-label {
      display: block;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.07em;
      margin-bottom: 0.4rem;
    }
    .dash-input, .dash-textarea {
      width: 100%;
      padding: 0.8rem 1rem;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(168, 85, 247, 0.2);
      color: var(--text);
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .dash-input:focus, .dash-textarea:focus {
      border-color: var(--purple-mid);
    }
    .dash-input::placeholder, .dash-textarea::placeholder {
      color: var(--text-muted);
    }
    .dash-textarea {
      resize: vertical;
      min-height: 80px;
    }
    .section-title {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.07em;
      margin-bottom: 0.5rem;
    }
    .links-list {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }
    .link-row {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }
    .link-row .dash-input {
      flex: 1;
    }
    .remove-btn {
      background: none;
      border: 1px solid rgba(255,255,255,0.1);
      color: var(--text-muted);
      font-size: 1rem;
      width: 34px;
      height: 34px;
      border-radius: 8px;
      cursor: pointer;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color 0.2s, color 0.2s;
    }
    .remove-btn:hover {
      border-color: #f87171;
      color: #f87171;
    }
    .add-link-btn {
      background: none;
      border: 1px dashed rgba(168, 85, 247, 0.35);
      color: var(--purple-bright);
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.85rem;
      font-weight: 500;
      padding: 0.6rem;
      border-radius: 12px;
      cursor: pointer;
      width: 100%;
      transition: background 0.2s, border-color 0.2s;
    }
    .add-link-btn:hover {
      background: rgba(168, 85, 247, 0.08);
      border-color: var(--purple-bright);
    }
    .save-btn {
      margin-top: 0.5rem;
      padding: 0.9rem;
      border-radius: var(--radius-btn);
      background: var(--purple-mid);
      border: none;
      color: #fff;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s;
    }
    .save-btn:hover {
      background: var(--purple-bright);
      transform: translateY(-1px);
    }
    .save-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }
    .status-msg {
      font-size: 0.85rem;
      text-align: center;
      min-height: 1.2em;
      color: var(--text-muted);
    }
    .status-msg.success { color: #4ade80; }
    .status-msg.error { color: #f87171; }
    .view-link {
      text-align: center;
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-top: 0.25rem;
    }
    .view-link a {
      color: var(--purple-bright);
      text-decoration: none;
    }
    .view-link a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="bg-aurora" aria-hidden="true"></div>
  <div class="bg-aurora-mid" aria-hidden="true"></div>

  <main class="page">
    <div class="card dash-card" id="dashCard" style="display:none">
      <div class="dash-header">
        <div>
          <div class="dash-title">Dashboard</div>
          <div class="dash-username" id="usernameDisplay"></div>
        </div>
        <button class="logout-btn" id="logoutBtn">Log out</button>
      </div>

      <form class="dash-form" id="dashForm">
        <div>
          <label class="field-label" for="displayName">Display name</label>
          <input class="dash-input" type="text" id="displayName" placeholder="Your name" />
        </div>
        <div>
          <label class="field-label" for="bio">Bio</label>
          <textarea class="dash-textarea" id="bio" placeholder="Short description about you…"></textarea>
        </div>

        <div>
          <div class="section-title">Links</div>
          <div class="links-list" id="linksList"></div>
          <button type="button" class="add-link-btn" id="addLinkBtn">+ Add link</button>
        </div>

        <p class="status-msg" id="statusMsg"></p>
        <button type="submit" class="save-btn" id="saveBtn">Save changes</button>
      </form>

      <p class="view-link" id="viewLink"></p>
    </div>
  </main>

  <script type="module">
    import { supabase } from './supabase-client.js'

    // Auth guard
    const { data: { session } } = await supabase.auth.getSession()
    if (!session) {
      window.location.href = '/login'
    }

    const user = session.user
    const dashCard = document.getElementById('dashCard')
    const usernameDisplay = document.getElementById('usernameDisplay')
    const displayNameInput = document.getElementById('displayName')
    const bioInput = document.getElementById('bio')
    const linksList = document.getElementById('linksList')
    const statusMsg = document.getElementById('statusMsg')
    const saveBtn = document.getElementById('saveBtn')
    const viewLink = document.getElementById('viewLink')

    // Load existing profile
    const { data: profile } = await supabase
      .from('profiles')
      .select('*')
      .eq('id', user.id)
      .single()

    if (profile) {
      usernameDisplay.textContent = '/' + profile.username
      displayNameInput.value = profile.display_name || ''
      bioInput.value = profile.bio || ''
      viewLink.innerHTML = `View your page: <a href="/${profile.username}" target="_blank">/${profile.username}</a>`
      ;(profile.links || []).forEach(link => addLinkRow(link.label, link.url))
    }

    dashCard.style.display = ''

    // Add link row
    function addLinkRow(label = '', url = '') {
      const row = document.createElement('div')
      row.className = 'link-row'
      row.innerHTML = `
        <input class="dash-input" type="text" placeholder="Label (e.g. Spotify)" value="${escapeAttr(label)}" data-field="label" />
        <input class="dash-input" type="url" placeholder="URL" value="${escapeAttr(url)}" data-field="url" />
        <button type="button" class="remove-btn" title="Remove">×</button>
      `
      row.querySelector('.remove-btn').addEventListener('click', () => row.remove())
      linksList.appendChild(row)
    }

    document.getElementById('addLinkBtn').addEventListener('click', () => addLinkRow())

    // Logout
    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await supabase.auth.signOut()
      window.location.href = '/'
    })

    // Save
    document.getElementById('dashForm').addEventListener('submit', async (e) => {
      e.preventDefault()
      statusMsg.textContent = ''
      statusMsg.className = 'status-msg'
      saveBtn.disabled = true
      saveBtn.textContent = 'Saving…'

      const links = []
      linksList.querySelectorAll('.link-row').forEach(row => {
        const label = row.querySelector('[data-field="label"]').value.trim()
        const url = row.querySelector('[data-field="url"]').value.trim()
        if (label && url) links.push({ label, url })
      })

      const { error } = await supabase.from('profiles').update({
        display_name: displayNameInput.value.trim(),
        bio: bioInput.value.trim(),
        links
      }).eq('id', user.id)

      saveBtn.disabled = false
      saveBtn.textContent = 'Save changes'

      if (error) {
        statusMsg.textContent = error.message
        statusMsg.className = 'status-msg error'
      } else {
        statusMsg.textContent = 'Saved!'
        statusMsg.className = 'status-msg success'
        setTimeout(() => { statusMsg.textContent = '' }, 2500)
      }
    })

    function escapeAttr(str) {
      return String(str).replace(/"/g, '&quot;').replace(/'/g, '&#39;')
    }
  </script>
</body>
</html>
